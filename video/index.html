<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>p100 agency — סרטון</title>
<style>
@font-face{font-family:"HeeboHe";font-weight:500;src:url("fonts/heebo-hebrew-500-normal.woff2") format("woff2");}
@font-face{font-family:"HeeboHe";font-weight:900;src:url("fonts/heebo-hebrew-900-normal.woff2") format("woff2");}
@font-face{font-family:"HeeboLat";font-weight:500;src:url("fonts/heebo-latin-500-normal.woff2") format("woff2");}
@font-face{font-family:"HeeboLat";font-weight:900;src:url("fonts/heebo-latin-900-normal.woff2") format("woff2");}
html,body{margin:0;background:#050f0c;height:100%;overflow:hidden}
canvas{display:block;margin:0 auto;height:100vh;width:auto}
body.render canvas{height:1920px;width:1080px;margin:0}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ───────────────────────── תזמון: לעדכן כאן אחרי ההקלטה ─────────────────────────
// זמן ההתחלה (בשניות) של כל משפט בקריינות, לפי הסדר. DURATION = סוף הסרטון.
const SCENE_STARTS = [0, 6.5, 13.5, 20, 27.5, 34.5, 40.5];
const DURATION = 46;
// ────────────────────────────────────────────────────────────────────────────────

const W = 1080, H = 1920, FPS = 30;
const C = { bg1:'#0e2f25', bg2:'#0a241c', panel:'#123a2d', cream:'#f3eee2', gold:'#d4b06a', orange:'#ff7a45', ink:'#0a241c' };
const FONT = '"HeeboHe","HeeboLat",sans-serif';
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── עזרים ──
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp = (a,b,p)=>a+(b-a)*p;
const prog = (t,a,b)=>clamp((t-a)/(b-a));
const eOut = p=>1-Math.pow(1-p,3);
const eIn = p=>p*p*p;
const eInOut = p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const eBack = p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const rnd = i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
let GA = 1;
const setA = a=>{ctx.globalAlpha=clamp(GA*a);};

function setFont(size,weight){ctx.font=`${weight} ${size}px ${FONT}`;}
// טקסט שמתכווץ אוטומטית כדי לא לחרוג מ-maxW
function text(str,x,y,size,o={}){
  const {weight=900,color=C.cream,align='center',maxW=W-160,alpha=1,dir='rtl'}=o;
  ctx.direction=dir;ctx.textBaseline='middle';ctx.textAlign=align;
  let s=size;setFont(s,weight);
  while(ctx.measureText(str).width>maxW&&s>20){s-=2;setFont(s,weight);}
  setA(alpha);ctx.fillStyle=color;ctx.fillText(str,x,y);
  return ctx.measureText(str).width;
}
// טקסט שנכנס בעלייה עדינה
function riseText(str,x,y,size,p,o={}){ const e=eOut(p); text(str,x,y+(1-e)*36,size,{...o,alpha:(o.alpha??1)*e}); }
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
const SHADOW='rgba(0,0,0,0.40)',GLOW_GOLD='rgba(212,176,106,0.55)',GLOW_ORANGE='rgba(255,122,69,0.6)';
function sh(blur=42,oy=18,col=SHADOW){ctx.shadowColor=col;ctx.shadowBlur=blur;ctx.shadowOffsetX=0;ctx.shadowOffsetY=oy;}
function noSh(){ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;}
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
function mix(c1,c2,p){const a=hex(c1),b=hex(c2);return `rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],p))).join(',')})`;}
function bubble(x,y,w,h,color,o={}){
  const {tail='right',r=Math.min(44,h/2),alpha=1,tailK=1,shadow=true}=o;
  // גוף וזנב בנתיב אחד (אותו כיוון סיבוב), כדי שלא תהיה חפיפה כפולה בזמן דהייה
  setA(alpha);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2));
  if(tail==='right'&&tailK>0){const ax=x+w-r*.9,ay=y+h-2,bx=x+w-8,by=y+h-r*.9,mx=(ax+bx)/2,my=(ay+by)/2;
    ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(lerp(mx,x+w+14,tailK),lerp(my,y+h+16,tailK));ctx.closePath();}
  if(shadow)sh();ctx.fill('nonzero');noSh();
}
// טיפוגרפיה קינטית: כל מילה נכנסת בנפרד — קפיצה, מתיחה ונחיתה. specs[i]={t0,color,glow}
function kWords(words,cx,y,size,lt,specs,o={}){
  const {maxW=W-170,weight=900,align='center'}=o;
  ctx.direction='rtl';ctx.textBaseline='middle';ctx.textAlign='center';
  let s=size,ws,tot;
  for(;;){setFont(s,weight);ws=words.map(w=>ctx.measureText(w).width);tot=ws.reduce((a,b)=>a+b,0)+s*.26*(words.length-1);if(tot<=maxW||s<=24)break;s-=2;}
  const right=align==='right'?cx:cx+tot/2;let xr=right;
  words.forEach((w,i)=>{const wc=xr-ws[i]/2;xr-=ws[i]+s*.26;
    const sp=specs[i],p=prog(lt,sp.t0,sp.t0+.4);if(p<=0)return;
    const e=eBack(p),eo=eOut(p),q=Math.sin(prog(lt,sp.t0+.4,sp.t0+.66)*Math.PI);
    const sx=lerp(.5,1,e)*(1+.05*q),sy=lerp(.5,1,e)*(1+.45*(1-eo))*(1-.09*q);
    ctx.save();ctx.translate(wc,y+(1-eo)*80+s*.35);ctx.rotate((1-eo)*(i%2?-.14:.14));ctx.scale(sx,sy);
    setA(clamp(p*3.5));if(sp.glow){ctx.shadowColor=sp.glow;ctx.shadowBlur=36;}
    setFont(s,weight);ctx.fillStyle=sp.color;ctx.fillText(w,0,-s*.35);ctx.restore();});
  return {s,right,tot};
}
function kinetic(str,cx,y,size,lt,t0,o={}){
  const {color=C.cream,glow=null,stagger=.11,mark=null,markT=null}=o;
  const words=str.split(' ');
  const L=kWords(words,cx,y,size,lt,words.map((w,i)=>({t0:t0+i*stagger,color,glow})),o);
  if(mark){const tm=markT??(t0+words.length*stagger+.3),mp=eOut(prog(lt,tm,tm+.45));
    if(mp>0){setA(1);ctx.fillStyle=mark;rr(L.right-L.tot*mp,y+L.s*.66,L.tot*mp,L.s*.075,L.s*.04);ctx.fill();}}
  return L;
}
function pill(cx,cy,str,size,o={}){
  const {bg=C.panel,color=C.cream,stroke=C.gold,alpha=1,scale=1,padX=38,weight=900,dot=null}=o;
  ctx.direction='rtl';setFont(size,weight);
  const tw=ctx.measureText(str).width, w=tw+padX*2+(dot?34:0), h=size*1.55;
  ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
  setA(alpha);ctx.fillStyle=bg;rr(-w/2,-h/2,w,h,h/2);if(bg[0]==='#')sh(30,12);ctx.fill();noSh();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();}
  if(dot){ctx.fillStyle=dot;ctx.beginPath();ctx.arc(w/2-padX-4,0,11,0,7);ctx.fill();}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=color;
  ctx.fillText(str,dot?-17:0,size*0.04);
  ctx.restore();
}
// קו שבור שמצויר בהדרגה (pts = [[x,y],...])
function polyProg(pts,p,color,lw){
  if(p<=0)return;let tot=0;const L=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);L.push(d);tot+=d;}
  let left=tot*clamp(p);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length&&left>0;i++){const k=Math.min(1,left/L[i-1]);
    ctx.lineTo(lerp(pts[i-1][0],pts[i][0],k),lerp(pts[i-1][1],pts[i][1],k));left-=L[i-1];}
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
}
function check(cx,cy,s,p,color,lw){polyProg([[cx-.45*s,cy+.02*s],[cx-.12*s,cy+.34*s],[cx+.48*s,cy-.32*s]],p,color,lw);}
function typingDots(cx,cy,t,color,gap=46,r=13){
  for(let i=0;i<3;i++){const b=Math.max(0,Math.sin(t*5-i*.7))*14;ctx.fillStyle=color;ctx.beginPath();ctx.arc(cx+(i-1)*gap,cy-b,r,0,7);ctx.fill();}
}
function logo(cx,cy,size,alpha=1){
  ctx.direction='ltr';ctx.textBaseline='middle';ctx.textAlign='left';
  setFont(size,900);const w1=ctx.measureText('p100').width;
  setFont(size,500);const w2=ctx.measureText(' agency').width;
  const x0=cx-(w1+w2)/2;setA(alpha);
  setFont(size,900);ctx.fillStyle=C.gold;ctx.fillText('p100',x0,cy);
  setFont(size,500);ctx.fillStyle=C.cream;ctx.fillText(' agency',x0+w1,cy);
  return {x0,w:w1+w2};
}
// מילים בעברית מימין לשמאל, כל אחת עם צבע/שקיפות משלה
function rtlWords(words,cx,y,size,styles){
  ctx.direction='rtl';ctx.textBaseline='middle';ctx.textAlign='right';setFont(size,900);
  const sp=size*.28, ws=words.map(w=>ctx.measureText(w).width);
  let x=cx+(ws.reduce((a,b)=>a+b,0)+sp*(words.length-1))/2;
  words.forEach((w,i)=>{const st=styles[i];const e=eOut(st.p);setA(e);ctx.fillStyle=st.color;ctx.fillText(w,x,y+(1-e)*36);x-=ws[i]+sp;});
}

// ── רקע ──
function background(t){
  ctx.globalAlpha=1;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,C.bg1);g.addColorStop(1,C.bg2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gx=540+Math.sin(t*.21)*220, gy=640+Math.cos(t*.17)*160;
  const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,900);
  rg.addColorStop(0,'rgba(34,96,72,0.55)');rg.addColorStop(1,'rgba(34,96,72,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  // רשת נקודות עדינה, נחלשת בשליש התחתון
  const sp=72, off=(t*9)%sp;ctx.fillStyle=C.cream;
  for(let y=-sp+off;y<H+sp;y+=sp){const a=0.085*(1-0.7*prog(y,1100,1320));ctx.globalAlpha=a;
    for(let x=36;x<W;x+=sp){ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill();}}
  // כתמי אור רכים בשכבת עומק (רק בשני השלישים העליונים)
  for(let i=0;i<7;i++){const r=90+rnd(i+700)*150,x=rnd(i+710)*W+Math.sin(t*.13+i*2.1)*90,y=120+rnd(i+720)*900+Math.cos(t*.11+i*1.3)*70;
    const g2=ctx.createRadialGradient(x,y,0,x,y,r),col=i%3?'243,238,226':'212,176,106';
    g2.addColorStop(0,`rgba(${col},0.075)`);g2.addColorStop(1,`rgba(${col},0)`);ctx.globalAlpha=1;ctx.fillStyle=g2;ctx.fillRect(x-r,y-r,r*2,r*2);}
  ctx.globalAlpha=1;
}
const grainTile=(()=>{const g=document.createElement('canvas');g.width=g.height=256;const x=g.getContext('2d'),im=x.createImageData(256,256);let sd=12345;
  for(let i=0;i<im.data.length;i+=4){sd=(sd*1664525+1013904223)>>>0;const v=128+((sd>>>16)%64-32);im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}
  x.putImageData(im,0,0);return g;})();
let grainPat=null;
function post(t){
  ctx.globalAlpha=1;
  const v=ctx.createRadialGradient(540,800,500,540,800,1250);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.42)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  grainPat=grainPat||ctx.createPattern(grainTile,'repeat');
  const ox=0,oy=0; // גרעיניות קבועה: נדחסת היטב ב-H.264
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.2;ctx.translate(-ox,-oy);ctx.fillStyle=grainPat;ctx.fillRect(0,0,W+256,H+256);ctx.restore();
}

// ── סצנה 1: בלגן של מערכות נשאב לבועה אחת ──
function scene1(lt,d,t){
  pill(540,150,'לעסקים קטנים',44,{bg:'rgba(0,0,0,0)',color:C.gold});
  kinetic('כל העסק.',540,330,168,lt,-2);
  const pu=1+.03*Math.sin(prog(lt,.35,.8)*Math.PI);
  ctx.save();ctx.translate(540,510);ctx.scale(pu,pu);ctx.translate(-540,-510);
  kinetic('בצ\'אט אחד.',540,510,168,lt,-2,{color:C.gold,glow:GLOW_GOLD,mark:C.orange,markT:.4});ctx.restore();
  const cx=540,cy=930;
  for(let i=0;i<9;i++){
    const p=eIn(prog(lt,2.6+i*.09,3.7+i*.09)); if(p>=1)continue;
    const w=250+rnd(i)*130,h=170+rnd(i+20)*90;
    const bx=cx+(rnd(i+40)-.5)*600+Math.sin(t*1.3+i)*8, by=cy+40+(rnd(i+60)-.5)*430+Math.cos(t*1.1+i*2)*8;
    const rot=(rnd(i+80)-.5)*.6+Math.sin(t*2.2+i*1.7)*.035;
    const ang=p*2.4, dx=bx-cx, dy=by-cy, k=1-p;
    const x=cx+(dx*Math.cos(ang)-dy*Math.sin(ang))*k, y=cy+(dx*Math.sin(ang)+dy*Math.cos(ang))*k;
    ctx.save();ctx.translate(x,y);ctx.rotate(rot+ang);ctx.scale(k,k);
    setA(.96);ctx.fillStyle=C.panel;rr(-w/2,-h/2,w,h,18);sh(26,12);ctx.fill();noSh();
    ctx.strokeStyle=i%4===1?C.gold:C.cream;ctx.lineWidth=3;setA(.6);ctx.stroke();
    setA(.5);ctx.fillStyle=C.cream;
    for(let k2=0;k2<3;k2++){ctx.beginPath();ctx.arc(-w/2+24+k2*20,-h/2+22,5.5,0,7);ctx.fill();}
    ctx.fillRect(-w/2,-h/2+42,w,2.5);
    const kind=i%3,top=-h/2+62;setA(.38);
    if(kind===0){for(let r2=0;r2<3;r2++)for(let c2=0;c2<4;c2++){rr(-w/2+20+c2*(w-40)/4,top+r2*32,(w-40)/4-8,22,4);ctx.fill();}}
    else if(kind===1){for(let b=0;b<5;b++){const bh=20+rnd(i*7+b)*(h-110);ctx.fillRect(-w/2+26+b*(w-52)/5,h/2-18-bh,(w-52)/5-12,bh);}}
    else{for(let l=0;l<4;l++){rr(-w/2+20,top+l*26,(w-40)*(.5+rnd(i*5+l)*.5),12,6);ctx.fill();}}
    if(i%2===0){setA(1);ctx.fillStyle=C.orange;ctx.beginPath();ctx.arc(w/2-6,-h/2+6,17+Math.sin(t*6+i)*2.5,0,7);ctx.fill();}
    ctx.restore();
  }
  const bp=prog(lt,3.9,4.5);
  if(bp>0&&!HOUT){
    const rp=prog(lt,3.9,5.1);setA((1-rp)*.7);ctx.strokeStyle=C.gold;ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(cx,cy,120+rp*300,0,7);ctx.stroke();
    const s=eBack(bp);ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
    bubble(-210,-120,420,240,C.cream,{r:80,alpha:clamp(bp*3)});
    setA(1);typingDots(0,6,t,C.ink,74,21);ctx.restore();
  }
}

// ── סצנה 2: הלוגו ושלושת התחומים ──
function scene2(lt,d,t){
  const lp=eInOut(prog(lt,.3,1.4));
  ctx.save();ctx.direction='ltr';setFont(150,900);const w1=ctx.measureText('p100').width;setFont(150,500);
  const tw=w1+ctx.measureText(' agency').width,x0=540-tw/2;
  ctx.beginPath();ctx.rect(x0-10,230,(tw+20)*lp,260);ctx.clip();logo(540,350,150);ctx.restore();
  if(lp<1||(lt<2&&Math.floor(lt*4)%2===0)){setA(lt<2?1:0);ctx.fillStyle=C.orange;ctx.fillRect(x0-6+(tw+16)*lp,275,8,150);}
  kinetic('הכול במקום אחד',540,505,66,lt,1.5,{color:C.gold,weight:500});
  const cx=540,cy=890,rx=345,ry=285;
  const op=eOut(prog(lt,1.8,2.6));
  setA(.35*op);ctx.strokeStyle=C.cream;ctx.lineWidth=3;ctx.setLineDash([4,18]);ctx.lineCap='round';
  ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,7);ctx.stroke();
  setA(.18*op);ctx.beginPath();ctx.ellipse(cx,cy,rx*.62,ry*.62,0,0,7);ctx.stroke();ctx.setLineDash([]);
  if(!HIN&&!HOUT){ctx.save();ctx.translate(cx,cy);bubble(-125,-85,250,170,C.cream,{r:60});setA(1);typingDots(0,4,t,C.ink,48,14);ctx.restore();}
  ['עסק','שיווק','זמן'].forEach((wd,i)=>{
    const p=prog(lt,2.5+i*.9,3.0+i*.9);if(p<=0)return;
    const a=-Math.PI/2+i*2*Math.PI/3+lt*.3;
    const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
    setA(.3*p);ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*150,cy+Math.sin(a)*125);ctx.lineTo(cx+Math.cos(a)*(rx-95),cy+Math.sin(a)*(ry-60));ctx.stroke();
    pill(x,y,wd,62,{scale:eBack(p),alpha:clamp(p*3),bg:i===1?C.gold:C.panel,color:i===1?C.ink:C.cream});
  });
}

// ── סצנה 3: הודעה קולית / הקלדה, והעבודה ברקע ──
function scene3(lt,d,t){
  kinetic('אתה מדבר.',540,225,136,lt,.1);
  kinetic('היא עובדת.',540,375,136,lt,2.9,{color:C.gold,glow:GLOW_GOLD,mark:C.orange});
  // בועת הקלטה
  const vp=prog(lt,.4,.8);
  if(!HIN){ctx.save();ctx.translate(960,560);
    bubble(-580,-65,580,130,C.cream);
    const ga0=GA;GA*=eOut(vp);const ps=eBack(vp);
    setA(1);ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(-65,0,38*ps,0,7);ctx.fill();
    ctx.fillStyle=C.cream;ctx.beginPath();ctx.moveTo(-76,-17);ctx.lineTo(-76,17);ctx.lineTo(-47,0);ctx.closePath();ctx.fill();
    const fp=prog(lt,.8,2.4);
    for(let i=0;i<30;i++){const bh=14+rnd(i+200)*62*(.6+.4*Math.sin(i*.9));const x=-125-i*13.5;
      const on=i/30<fp;ctx.fillStyle=on?C.orange:C.ink;setA(on?1:.3);rr(x-4,-bh/2,8,bh,4);ctx.fill();}
    GA=ga0;ctx.restore();}
  // בועת הקלדה
  const msg='חשבונית ללקוח ותזכורת למחר';
  const tp=prog(lt,1.5,1.8);
  if(tp>0&&!HOUT){const n=Math.round(prog(lt,1.8,2.9)*msg.length),str=msg.slice(0,n);
    ctx.direction='rtl';setFont(50,500);const tw=ctx.measureText(str).width,bw=Math.max(150,tw+84);
    bubble(960-bw,665,bw,104,C.cream,{alpha:eOut(tp)});
    if(n===0){setA(eOut(tp));typingDots(960-75,717,t,C.ink,30,8);}
    else text(str,960-42,719,50,{weight:500,color:C.ink,align:'right'});}
  // מאחורי הקלעים
  const sp2=eOut(prog(lt,2.9,3.4));
  setA(.5*sp2);ctx.strokeStyle=C.gold;ctx.lineWidth=3;ctx.setLineDash([3,14]);ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(140,850);ctx.lineTo(380,850);ctx.moveTo(700,850);ctx.lineTo(940,850);ctx.stroke();ctx.setLineDash([]);
  text('בינתיים, ברקע',540,850,44,{weight:500,color:C.gold,alpha:sp2});
  ['חשבונית נשלחה','תזכורת נקבעה','הלקוח עודכן'].forEach((lab,i)=>{
    const st=3.3+i*.75,p=prog(lt,st,st+.35);if(p<=0)return;const e=eOut(p);
    const y=912+i*112+(1-e)*30;
    setA(e);ctx.fillStyle=C.panel;rr(150,y,780,92,26);sh(34,14);ctx.fill();noSh();
    ctx.strokeStyle='rgba(243,238,226,0.22)';ctx.lineWidth=2.5;ctx.stroke();
    const done=prog(lt,st+.5,st+.85),cxx=876,cyy=y+46;

// ── סצנה 4: דוח, עצה, סדר — משיחה אחת ──
function scene4(lt,d,t){

// ── סצנה 5: בקשה → תמונה → סרטון → רילס → באוויר ──
function scene5(lt,d,t){

      ctx.beginPath();ctx.arc(cx,cy,260+rp*230,0,7);ctx.stroke();}
    for(let k=0;k<10;k++){const side=k%2?1:-1,x=cx+side*(200+rnd(k+300)*170),ph=(lt*1.6+rnd(k+320))%1;
      const y=1130-ph*520,len=50+rnd(k+340)*70;setA(Math.sin(ph*Math.PI)*.6*fly);ctx.strokeStyle=k%3?C.cream:C.orange;ctx.lineWidth=5;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+len);ctx.stroke();}}
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  setA(1);ctx.fillStyle=C.cream;rr(-w/2-10,-h/2-10,w+20,h+20,36);sh(54,26);ctx.fill();noSh();
  ctx.save();rr(-w/2,-h/2,w,h,26);ctx.clip();
  const g=ctx.createLinearGradient(0,-h/2,0,h/2);g.addColorStop(0,'#1f5a45');g.addColorStop(1,'#123a2d');ctx.fillStyle=g;ctx.fillRect(-w/2,-h/2,w,h);

  ctx.fillStyle=C.orange;ctx.beginPath();ctx.moveTo(-w*.1,h/2);ctx.lineTo(w*.22,h*.08);ctx.lineTo(w/2+20,h/2);ctx.closePath();ctx.fill();

    ctx.fillStyle=C.ink;ctx.beginPath();ctx.moveTo(-16,-26);ctx.lineTo(-16,26);ctx.lineTo(28,0);ctx.closePath();ctx.fill();
    setA(va*.5);ctx.fillStyle=C.cream;rr(-w/2+28,h/2-36,w-56,10,5);ctx.fill();
    setA(va);ctx.fillStyle=C.orange;rr(-w/2+28,h/2-36,(w-56)*prog(lt,2.8,4.2),10,5);ctx.fill();}
  // שכבת רילס
  if(m2>0){for(let k=0;k<3;k++){const sw=(w-56)/3;setA(m2*.45);ctx.fillStyle=C.cream;rr(-w/2+22+k*(sw+6),-h/2+22,sw,8,4);ctx.fill();
      const f=prog(lt,4.2+k*.7,4.9+k*.7);setA(m2);rr(-w/2+22+k*(sw+6),-h/2+22,Math.max(.01,sw*f),8,4);ctx.fill();}
    setA(m2);for(let k=0;k<3;k++){ctx.fillStyle=k===0?C.orange:C.cream;ctx.beginPath();ctx.arc(-w/2+44,h/2-60-k*62,k===0?20+Math.sin(t*6)*2.5:17,0,7);ctx.fill();}}
  const wo=prog(lt,d-.6,d-.32);if(wo>0){setA(wo);ctx.fillStyle=C.cream;ctx.fillRect(-w/2,-h/2,w,h);}
  ctx.restore();ctx.restore();
  // תווית

const SCENES=[scene1,scene2,scene3,scene4,scene5,scene6,scene7];

// ── "הגיבור": הצורה שעוברת בין הסצנות. לכל מעבר: מצב בסוף הסצנה היוצאת (A) ובתחילת הנכנסת (B) ──
const CREAM_B={color:C.cream,tail:1};
function heroDefs(i){ // i = אינדקס הסצנה הנכנסת
  ctx.direction='rtl';
  const typed='חשבונית ללקוח ותזכורת למחר';setFont(50,500);const bw=Math.max(150,ctx.measureText(typed).width+84);
  const req='פוסט למבצע של מחר';setFont(52,500);const rw=ctx.measureText(req).width+88;
  const dotsBig={gap:74,r:21,dy:6},dotsSm={gap:48,r:14,dy:4};
  const s2={cx:540,cy:890,w:250,h:170,r:60,...CREAM_B};
  const chat={cx:540,cy:455,w:360,h:104,r:52,color:C.cream,tail:0,label:{str:'שיחה אחת',size:54,weight:900,dy:4}};
  const circ=k=>({cx:868,cy:330+k*310,w:216,h:216,r:108,color:C.panel,tail:0});
  const btn={cx:540,cy:830,w:300,h:300,r:150,color:C.gold,tail:0};
  switch(i){
    case 1:return [[{cx:540,cy:930,w:420,h:240,r:80,...CREAM_B,dots:dotsBig},{...s2,dots:dotsSm}]];
    case 2:return [[{...s2,dots:dotsSm},{cx:670,cy:560,w:580,h:130,r:44,...CREAM_B}]];
    case 3:return [[{cx:960-bw/2,cy:717,w:bw,h:104,r:44,...CREAM_B,label:{str:typed,size:50,weight:500,dy:2}},chat]];
    case 4:return [[chat,{cx:960-rw/2,cy:535,w:rw,h:110,r:44,...CREAM_B,label:{str:req,size:52,weight:500,dy:3}}]];
    case 5:return [[{cx:540,cy:830,w:310,h:500,r:36,color:C.cream,tail:0},circ(0)]];
    case 6:return [0,1,2].map(k=>[circ(k),btn]);
  }
}
const CAM={x:540,y:700,k:.035};
let HIN=false,HOUT=false; // האם ה"גיבור" מחליף כרגע את האלמנט של הסצנה (בכניסה / ביציאה)
const heroOn=(i,t)=>i>0&&i<SCENE_STARTS.length&&t-SCENE_STARTS[i]>=-.3&&t-SCENE_STARTS[i]<.4;
const sceneEnd=i=>i+1<SCENE_STARTS.length?SCENE_STARTS[i+1]:DURATION;
const camZ=(i,t)=>1+CAM.k*(t-SCENE_STARTS[i])/(sceneEnd(i)-SCENE_STARTS[i]);
function drawHero(t){
  for(let i=1;i<SCENE_STARTS.length;i++){
    const st=SCENE_STARTS[i];if(!heroOn(i,t))continue;
    const zA=camZ(i-1,t),zB=camZ(i,t);
    heroDefs(i).forEach(([A,B])=>{
      for(let g=3;g>=0;g--){ // g>0: שובל תנועה
        const p=eInOut(prog(t-g*.03,st-.3,st+.4));if(g&&(p<=0||p>=1))continue;
        const L=k=>lerp(CAM[k[1]]+(A[k]-CAM[k[1]])*zA,CAM[k[1]]+(B[k]-CAM[k[1]])*zB,p),S=k=>lerp(A[k]*zA,B[k]*zB,p);
        const arc=Math.sin(p*Math.PI),cx=L('cx'),cy=L('cy')-arc*46,w=S('w')*(1+.07*arc),h=S('h')*(1-.05*arc),r=S('r');
        GA=g?.13:1;
        bubble(cx-w/2,cy-h/2,w,h,mix(A.color,B.color,p),{r,tailK:lerp(A.tail,B.tail,p),shadow:!g});
        if(g)continue;
        const z=lerp(zA,zB,p);
        if(A.dots||B.dots){const da=A.dots||B.dots,db=B.dots||A.dots;GA=A.dots&&B.dots?1:A.dots?1-prog(p,0,.4):prog(p,.6,1);setA(1);
          typingDots(cx,cy+lerp(da.dy,db.dy,p)*z,t,C.ink,lerp(da.gap,db.gap,p)*z,lerp(da.r,db.r,p)*z);}
        [[A.label,1-prog(p,0,.3)],[B.label,prog(p,.7,1)]].forEach(([lb,al])=>{if(!lb||al<=0||(A.label===B.label&&lb===B.label&&al<1&&p<.5))return;
          GA=A.label===B.label?1:al;text(lb.str,cx,cy+lb.dy*z,lb.size*z,{weight:lb.weight,color:C.ink,maxW:w});});
      }
    });
  }
  GA=1;
}

// ── הפונקציה היחידה שמציירת פריים: תלויה רק בזמן t (בשניות) ──
function drawFrame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.setLineDash([]);noSh();ctx.globalCompositeOperation='source-over';
  background(t);
  for(let i=0;i<SCENES.length;i++){
    const st=SCENE_STARTS[i],en=sceneEnd(i);
    if(t<st||t>=en)continue;
    const lt=t-st,d=en-st,last=i===SCENES.length-1,out=last?0:eIn(prog(lt,d-.3,d));
    GA=(i===0?1:eOut(prog(lt,0,.4)))*(1-out);
    const z=camZ(i,t); // מצלמה: דחיפה איטית פנימה
    ctx.save();ctx.translate(CAM.x,CAM.y-out*50);ctx.scale(z,z);ctx.translate(-CAM.x,-CAM.y);
    HIN=heroOn(i,t);HOUT=heroOn(i+1,t);
    SCENES[i](lt,d,t);ctx.restore();
  }
  drawHero(t);
  GA=1;post(t);ctx.globalAlpha=1;
}

window.ready=Promise.all(['500','900'].flatMap(w=>[document.fonts.load(`${w} 40px "HeeboHe"`,'אבג'),document.fonts.load(`${w} 40px "HeeboLat"`,'abc')])).then(()=>true);
if(location.search.includes('render')){document.body.classList.add('render');}
else window.ready.then(()=>{const t0=performance.now();(function loop(){drawFrame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();});
