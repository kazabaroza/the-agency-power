# Fly.io config. The app name is set by the deploy workflow (FLY_APP_NAME), this is the default.
app = "the-agency-power-kazabaroza"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/app/data"
  NODE_ENV = "production"

# SQLite + generated files live on this volume.
[[mounts]]
  source = "agency_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  # The scheduler and the WhatsApp webhook need the server always on.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "10s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
