name: Deploy to Fly.io

# Runs on GitHub's servers. Needs the repository secret FLY_API_TOKEN.
# App keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, FAL_KEY, WHATSAPP_*, ...) are copied
# from repository secrets to the Fly app on every run, when they are set.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: deploy-fly

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP_NAME || 'the-agency-power-kazabaroza' }}
      REGION: ${{ vars.FLY_REGION || 'fra' }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN secret is not set - skipping deploy."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.skip != 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@v1
        if: steps.token.outputs.skip != 'true'

      - name: Create app and volume (first run only)
        if: steps.token.outputs.skip != 'true'
        run: |
          flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org personal
          if ! flyctl volumes list -a "$APP" --json | grep -q '"agency_data"'; then
            flyctl volumes create agency_data --size 1 --region "$REGION" -a "$APP" --yes
          fi

      - name: Sync secrets
        if: steps.token.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          args=("APP_URL=https://$APP.fly.dev")
          if [ -z "$SESSION_SECRET" ] && ! flyctl secrets list -a "$APP" | grep -q SESSION_SECRET; then
            args+=("SESSION_SECRET=$(openssl rand -hex 32)")
          fi
          for k in ANTHROPIC_API_KEY OPENAI_API_KEY FAL_KEY SESSION_SECRET UNSPLASH_ACCESS_KEY \
                   WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET \
                   META_ACCESS_TOKEN META_PAGE_ID META_IG_USER_ID META_AD_ACCOUNT_ID RESEND_API_KEY EMAIL_FROM; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); fi
          done
          flyctl secrets set --stage -a "$APP" "${args[@]}"

      - name: Deploy
        if: steps.token.outputs.skip != 'true'
        run: |
          set -o pipefail
          if ! flyctl deploy --remote-only -a "$APP" --primary-region "$REGION" --ha=false 2>&1 | tee deploy.log; then
            # Surface the end of the log as annotations so it is readable without log access.
            # GitHub keeps only 10 annotations per step, so send the tail as one annotation.
            {
              echo "== deploy (tail)"; tail -n 12 deploy.log
              echo "== status"; flyctl status -a "$APP" 2>&1 | tail -n 15
              echo "== app logs"; timeout 40 flyctl logs -a "$APP" --no-tail 2>&1 | tail -n 40
              echo "== http check"; curl -s -o /dev/null -m 20 -w "GET / -> %{http_code}\n" "https://$APP.fly.dev/" || true
            } > diag.log 2>&1
            msg=$(sed 's/\x1b\[[0-9;]*m//g' diag.log | grep -v '^\s*$' | grep -v 'pushing layer' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=deploy::${msg}"
            exit 1
          fi

      - name: Show address
        if: steps.token.outputs.skip != 'true'
        run: |
          echo "### The Agency Power is live: https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "WhatsApp webhook: https://$APP.fly.dev/api/whatsapp/webhook" >> "$GITHUB_STEP_SUMMARY"
