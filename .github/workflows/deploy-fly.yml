name: Deploy to Fly.io

# Runs on GitHub's servers. Needs the repository secret FLY_API_TOKEN.
# App keys (ANTHROPIC_API_KEY, OPENAI_API_KEY, FAL_KEY, WHATSAPP_*, ...) are copied
# from repository secrets to the Fly app on every run, when they are set.
on:
  workflow_dispatch:
    inputs:
      fresh_machine:
        description: "Destroy existing machines first (data on the volume is kept)"
        type: boolean
        default: false
      restore_db_copy:
        description: "Restore the database from a daily copy, e.g. agency-2026-11-05.db (leave empty for a normal deploy)"
        type: string
        default: ""
  push:
    branches: [main]

concurrency: deploy-fly

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: ${{ vars.FLY_APP_NAME || 'the-agency-power-kazabaroza' }}
      REGION: ${{ vars.FLY_REGION || 'fra' }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN secret is not set - skipping deploy."; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.skip != 'true'

      - uses: superfly/flyctl-actions/setup-flyctl@v1
        if: steps.token.outputs.skip != 'true'

      - name: Create app and volume (first run only)
        if: steps.token.outputs.skip != 'true'
        run: |
          flyctl status -a "$APP" >/dev/null 2>&1 || flyctl apps create "$APP" --org personal
          if ! flyctl volumes list -a "$APP" --json | grep -q '"agency_data"'; then
            flyctl volumes create agency_data --size 1 --region "$REGION" -a "$APP" --yes
          fi
          # Public addresses (a failed first deploy can leave the app without any).
          if ! flyctl ips list -a "$APP" --json | grep -q '"v6"\|"Type": *"v6"'; then flyctl ips allocate-v6 -a "$APP"; fi
          if ! flyctl ips list -a "$APP" --json | grep -qi 'shared_v4\|"v4"'; then flyctl ips allocate-v4 --shared -a "$APP"; fi
          flyctl ips list -a "$APP"

      - name: Sync secrets
        if: steps.token.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          LOGIN_ALLOWLIST: ${{ secrets.LOGIN_ALLOWLIST }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
          WHATSAPP_ALLOWLIST: ${{ secrets.WHATSAPP_ALLOWLIST }}
        run: |
          # WhatsApp token: a short-lived token is exchanged for a 60-day one; an expired
          # token is not copied, so the last good token on Fly stays in place.
          if [ -n "$WHATSAPP_TOKEN" ] && [ -n "$WHATSAPP_APP_SECRET" ]; then
            G=https://graph.facebook.com/v23.0
            dbg=$(curl -s "$G/debug_token?input_token=$WHATSAPP_TOKEN&access_token=$WHATSAPP_TOKEN")
            valid=$(echo "$dbg" | jq -r '.data.is_valid // false')
            app_id=$(echo "$dbg" | jq -r '.data.app_id // empty')
            exp=$(echo "$dbg" | jq -r '.data.expires_at // 0')
            now=$(date +%s)
            if [ "$valid" != "true" ]; then
              echo "::warning title=whatsapp-token::The WHATSAPP_TOKEN in GitHub is expired or invalid - keeping the token already on Fly."
              WHATSAPP_TOKEN=""
            elif [ "$exp" != "0" ] && [ $((exp - now)) -lt 1209600 ]; then
              new=$(curl -s "$G/oauth/access_token?grant_type=fb_exchange_token&client_id=$app_id&client_secret=$WHATSAPP_APP_SECRET&fb_exchange_token=$WHATSAPP_TOKEN" | jq -r '.access_token // empty')
              if [ -n "$new" ]; then
                WHATSAPP_TOKEN="$new"
                nexp=$(curl -s "$G/debug_token?input_token=$new&access_token=$new" | jq -r '.data.expires_at // 0')
                echo "::notice title=whatsapp-token::Token extended. Valid until $( [ "$nexp" = "0" ] && echo never || date -u -d @"$nexp" +%Y-%m-%d )."
              else
                echo "::warning title=whatsapp-token::Could not extend the token (it may be a system-user token or the app secret is wrong)."
              fi
            else
              echo "::notice title=whatsapp-token::Token is long-lived (expires: $( [ "$exp" = "0" ] && echo never || date -u -d @"$exp" +%Y-%m-%d ))."
            fi
          fi
          args=("APP_URL=https://$APP.fly.dev")
          if [ -z "$SESSION_SECRET" ] && ! flyctl secrets list -a "$APP" | grep -q SESSION_SECRET; then
            args+=("SESSION_SECRET=$(openssl rand -hex 32)")
          fi
          for k in ANTHROPIC_API_KEY OPENAI_API_KEY FAL_KEY SESSION_SECRET UNSPLASH_ACCESS_KEY \
                   WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET \
                   META_ACCESS_TOKEN META_PAGE_ID META_IG_USER_ID META_AD_ACCOUNT_ID RESEND_API_KEY EMAIL_FROM LOGIN_ALLOWLIST ACCESS_CODE WHATSAPP_ALLOWLIST; do
            if [ -n "${!k}" ]; then args+=("$k=${!k}"); fi
          done
          flyctl secrets set --stage -a "$APP" "${args[@]}"

      - name: Replace stuck machines
        if: steps.token.outputs.skip != 'true' && inputs.fresh_machine
        run: |
          for id in $(flyctl machines list -a "$APP" --json | grep -o '"id": *"[a-z0-9]*"' | grep -o '[a-z0-9]\{10,\}'); do
            echo "destroying $id"; flyctl machines destroy "$id" -a "$APP" --force
          done

      - name: Restore database from a daily copy
        if: steps.token.outputs.skip != 'true' && inputs.restore_db_copy != ''
        env:
          COPY: ${{ inputs.restore_db_copy }}
        run: |
          if ! printf '%s' "$COPY" | grep -Eq '^agency-[0-9]{4}-[0-9]{2}-[0-9]{2}\.db$'; then
            echo "::error title=restore::Name must look like agency-2026-11-05.db"; exit 1
          fi
          # Keep the current database first, then put the copy in place; the deploy below restarts the app.
          flyctl ssh console -a "$APP" -C "sh -c 'test -f /data/backups/$COPY && cp /data/agency.db /data/backups/before-restore-\$(date +%Y%m%d%H%M%S).db && cp /data/backups/$COPY /data/agency.db && rm -f /data/agency.db-wal /data/agency.db-shm && echo restored'" | tee restore.log
          grep -q restored restore.log || { echo "::error title=restore::Copy $COPY not found on the server"; exit 1; }
          echo "::notice title=restore::Database restored from $COPY (previous state kept in /data/backups)."

      - name: Deploy
        if: steps.token.outputs.skip != 'true'
        run: |
          set -o pipefail
          if ! flyctl deploy --remote-only -a "$APP" --primary-region "$REGION" --ha=false --wait-timeout 10m 2>&1 | tee deploy.log; then
            # Surface the end of the log as annotations so it is readable without log access.
            # GitHub keeps only 10 annotations per step, so send the tail as one annotation.
            # Diagnostics must never stop the step themselves.
            set +e +o pipefail
            {
              echo "== public IPs"; flyctl ips list -a "$APP" 2>&1 | tail -n 5
              echo "== http check from runner"; curl -sv -o /dev/null -m 20 "https://$APP.fly.dev/" 2>&1 | grep -E "Trying|Connected|HTTP/|error|timed out|resolve" | head -n 6
              echo "== machines"; flyctl machines list -a "$APP" 2>&1 | tail -n 4
              echo "== health checks"; flyctl checks list -a "$APP" 2>&1 | tail -n 12
              echo "== deploy (tail)"; tail -n 4 deploy.log
              echo "== app logs (last)"; timeout 40 flyctl logs -a "$APP" --no-tail 2>&1 | grep -v 'ExperimentalWarning\|trace-warnings' | tail -n 12
            } > diag.log 2>&1
            msg=$(sed 's/\x1b\[[0-9;]*m//g' diag.log | grep -v '^\s*$' | grep -v 'pushing layer' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=deploy::${msg}"
            exit 1
          fi

      - name: Verify the site answers
        if: steps.token.outputs.skip != 'true'
        run: |
          codes=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://$APP.fly.dev/" || true)
            codes="$codes $code"; echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          set +e
          msg=$( {
            echo "site did not answer 200. codes:$codes"
            echo "== next build output on Fly"
            grep -E "Route \(app\)|Generating static|Collecting page|Compiled|○ /|ƒ /|warn|rror|Static|Dynamic" deploy.log | sed 's/^#[0-9]* [0-9.]* //' | head -n 25
            echo "== response headers for / and /login"
            curl -s -D - -o /dev/null -m 15 "https://$APP.fly.dev/" | tr -d '\r' | grep -v -iE "^(date|content-length|strict-transport|alt-svc|via):" | head -n 12
            echo "-- /login"
            curl -s -D - -o /dev/null -m 15 "https://$APP.fly.dev/login" | tr -d '\r' | grep -iE "^HTTP|^location" | head -n 3
            echo "-- inside machine: build output"
            for c in "cat /srv/agency/.next/BUILD_ID" "ls /srv/agency/.next/server/app" "head -c 400 /srv/agency/.next/prerender-manifest.json" "head -c 200 /srv/agency/.next/server/app/en.html" "ls -la /data"; do
              echo "\$ $c"; timeout 60 flyctl ssh console -a "$APP" -C "$c" 2>&1 | grep -v "^Connecting to" | tr '\n' ' ' | head -c 500; echo
            done
            timeout 90 flyctl ssh console -a "$APP" -C "node -e \"(async()=>{for (const p of ['/robots.txt','/en','/api/track','/files/x.png']){try{const r=await fetch('http://127.0.0.1:3000'+p,{redirect:'manual'});console.log(p,r.status,r.headers.get('location'))}catch(e){console.log(p,'ERR')}}})()\"" 2>&1 | tail -n 4
            echo "-- inside machine, plain http, no redirects"
            timeout 90 flyctl ssh console -a "$APP" -C "node -e \"fetch('http://127.0.0.1:3000/',{redirect:'manual'}).then(r=>console.log('local',r.status,r.headers.get('location'))).catch(e=>console.log('local ERR',e.cause&&e.cause.code||e.message))\"" 2>&1 | tail -n 2
            echo "== recent logs"
            timeout 40 flyctl logs -a "$APP" --no-tail 2>&1 | grep -v 'ExperimentalWarning\|trace-warnings' | tail -n 8
          } | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=deploy::${msg}"
          exit 1

      - name: Backups (volume snapshots + daily database copies)
        if: steps.token.outputs.skip != 'true'
        run: |
          set +e
          VOL=$(flyctl volumes list -a "$APP" --json | jq -r '[.[] | select(.name=="agency_data")][0].id // empty')
          if [ -z "$VOL" ]; then echo "::warning title=backups::volume agency_data not found"; exit 0; fi
          upd=$(flyctl volumes update "$VOL" -a "$APP" --scheduled-snapshots=true --snapshot-retention "${SNAPSHOT_RETENTION:-30}" 2>&1 | tail -n 2 | tr '\n' ' ')
          snaps=$(flyctl volumes snapshots list "$VOL" -a "$APP" --json 2>/dev/null)
          n=$(echo "$snaps" | jq 'length' 2>/dev/null || echo "?")
          last=$(echo "$snaps" | jq -r 'sort_by(.created_at) | last | .created_at // "none"' 2>/dev/null)
          copies=$(timeout 60 flyctl ssh console -a "$APP" -C "ls /data/backups" 2>/dev/null | grep -o 'agency-[0-9-]*\.db' | tr '\n' ' ')
          echo "::notice title=backups::volume snapshots: $n (latest: $last) | retention set: ${upd:-ok} | daily DB copies: ${copies:-none yet}"
        env:
          SNAPSHOT_RETENTION: ${{ vars.SNAPSHOT_RETENTION || '30' }}

      - name: Check WhatsApp setup
        if: steps.token.outputs.skip != 'true'
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WA_ALLOW: ${{ secrets.WHATSAPP_ALLOWLIST }}
        run: |
          set +e
          out=""
          for k in WHATSAPP_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_VERIFY_TOKEN WHATSAPP_APP_SECRET; do
            if [ -n "${!k}" ]; then out="$out $k=set"; else out="$out $k=MISSING"; fi
          done
          if [ -n "$WHATSAPP_VERIFY_TOKEN" ]; then
            r=$(curl -s -m 15 "https://$APP.fly.dev/api/whatsapp/webhook?hub.mode=subscribe&hub.verify_token=$(printf %s "$WHATSAPP_VERIFY_TOKEN" | jq -sRr @uri)&hub.challenge=ok123")
            if [ "$r" = "ok123" ]; then out="$out | webhook handshake: OK"; else out="$out | webhook handshake: FAILED"; fi
          fi
          if [ -n "$WHATSAPP_TOKEN" ] && [ -n "$WHATSAPP_PHONE_NUMBER_ID" ]; then
            j=$(curl -s -m 15 "https://graph.facebook.com/v23.0/$WHATSAPP_PHONE_NUMBER_ID?fields=display_phone_number,verified_name" -H "Authorization: Bearer $WHATSAPP_TOKEN")
            if echo "$j" | grep -q display_phone_number; then
              out="$out | Meta token + phone id: OK ($(echo "$j" | jq -r '.verified_name + " " + .display_phone_number'))"
            else
              out="$out | Meta token + phone id: FAILED ($(echo "$j" | jq -r '.error.message // "unknown"' | head -c 160))"
            fi
          fi
          echo "::notice title=whatsapp::$out"
          # Allowlist as the server will read it (masked), and recent denied senders (masked).
          al=$( (printf '%s' "$WA_ALLOW" | tr ',; ' '\n\n\n' | sed '/^$/d'; echo) | while read -r n || [ -n "$n" ]; do [ -z "$n" ] && continue; d=$(printf '%s' "$n" | tr -cd '0-9'); d=${d#00}; case "$d" in 9720*) d="972${d#9720}";; 0*) d="972${d#0}";; esac; printf '%s ' "${d:0:5}***${d: -2} (${#d} digits)"; done)
          denied=$(timeout 40 flyctl logs -a "$APP" --no-tail 2>/dev/null | grep -o 'denied [0-9*]*' | sort -u | tail -n 5 | tr '\n' ' ')
          echo "::notice title=whatsapp-allowlist::allowlist secret: $( [ -n "$WA_ALLOW" ] && echo "set (${#WA_ALLOW} chars)" || echo MISSING ) | numbers: ${al:-none} | recently denied: ${denied:-none}"

      - name: Connect WhatsApp webhook at Meta
        if: steps.token.outputs.skip != 'true'
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
        run: |
          set +e
          if [ -z "$WHATSAPP_TOKEN" ] || [ -z "$WHATSAPP_VERIFY_TOKEN" ] || [ -z "$WHATSAPP_APP_SECRET" ]; then echo "WhatsApp secrets not set - skipping"; exit 0; fi
          G=https://graph.facebook.com/v23.0
          dbg=$(curl -s "$G/debug_token?input_token=$WHATSAPP_TOKEN&access_token=$WHATSAPP_TOKEN")
          APP_ID=$(echo "$dbg" | jq -r '.data.app_id // empty')
          WABA_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID:-$(echo "$dbg" | jq -r '[.data.granular_scopes[]? | select(.scope=="whatsapp_business_management") | .target_ids[]?][0] // empty')}
          out="app_id=${APP_ID:-?} waba_id=${WABA_ID:-?}"
          if [ -n "$APP_ID" ]; then
            r=$(curl -s -X POST "$G/$APP_ID/subscriptions" \
              --data-urlencode "object=whatsapp_business_account" \
              --data-urlencode "callback_url=https://$APP.fly.dev/api/whatsapp/webhook" \
              --data-urlencode "fields=messages" \
              --data-urlencode "verify_token=$WHATSAPP_VERIFY_TOKEN" \
              --data-urlencode "access_token=$APP_ID|$WHATSAPP_APP_SECRET")
            if echo "$r" | grep -q '"success":true'; then out="$out | webhook registered: OK"; else out="$out | webhook registered: FAILED ($(echo "$r" | jq -r '.error.message // .' | head -c 200))"; fi
          else
            out="$out | could not read app id from token ($(echo "$dbg" | jq -r '.error.message // .data.error.message // "?"' | head -c 150))"
          fi
          if [ -n "$WABA_ID" ]; then
            r=$(curl -s -X POST "$G/$WABA_ID/subscribed_apps" -H "Authorization: Bearer $WHATSAPP_TOKEN")
            if echo "$r" | grep -q '"success":true'; then out="$out | WABA subscribed: OK"; else out="$out | WABA subscribed: FAILED ($(echo "$r" | jq -r '.error.message // .' | head -c 200))"; fi
          fi
          echo "::notice title=whatsapp-webhook::$out"

      - name: WhatsApp update template
        if: steps.token.outputs.skip != 'true'
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_BUSINESS_ACCOUNT_ID: ${{ secrets.WHATSAPP_BUSINESS_ACCOUNT_ID }}
        run: |
          set +e
          if [ -z "$WHATSAPP_TOKEN" ]; then echo "no WhatsApp token - skipping"; exit 0; fi
          G=https://graph.facebook.com/v23.0
          NAME=agency_update
          # Candidate business account ids: the secret, then every account the token can manage.
          dbg=$(curl -s "$G/debug_token?input_token=$WHATSAPP_TOKEN&access_token=$WHATSAPP_TOKEN")
          cands="$WHATSAPP_BUSINESS_ACCOUNT_ID $(echo "$dbg" | jq -r '[.data.granular_scopes[]? | select(.scope|test("whatsapp")) | .target_ids[]?] | unique | .[]' | tr '\n' ' ')"
          WABA=""; tried=""
          for c in $cands; do
            r=$(curl -s "$G/$c/message_templates?fields=name,status,category,language&limit=200" -H "Authorization: Bearer $WHATSAPP_TOKEN")
            if echo "$r" | jq -e '.data' >/dev/null 2>&1; then
              # The phone number must belong to this account.
              p=$(curl -s "$G/$c/phone_numbers?fields=id" -H "Authorization: Bearer $WHATSAPP_TOKEN" | jq -r '.data[]?.id')
              if [ -z "$WHATSAPP_PHONE_NUMBER_ID" ] || echo "$p" | grep -qx "$WHATSAPP_PHONE_NUMBER_ID"; then WABA=$c; LIST=$r; break; fi
              tried="$tried ${c: -4}:no-phone"
            else tried="$tried ${c: -4}:$(echo "$r" | jq -r '"\(.error.code // "?")/\(.error.error_subcode // "-") \(.error.message // "" | .[0:120])"')"; fi
          done
          tinfo=$(echo "$dbg" | jq -r '.data | "type=\(.type // "?") app=\(.application // "?") valid=\(.is_valid) scopes=\((.scopes // []) | join(",")) granular=\([(.granular_scopes // [])[] | "\(.scope):\([(.target_ids // [])[] | .[-4:]] | join("/"))"] | join(" "))"')
          echo "::notice title=whatsapp-token-scopes::$tinfo"
          if [ -z "$WABA" ]; then echo "::warning title=whatsapp-template::no usable business account (tried:${tried:- none}). Add WHATSAPP_BUSINESS_ACCOUNT_ID from Meta > WhatsApp > API Setup."; exit 0; fi
          cur=$(echo "$LIST" | jq -r --arg n "$NAME" '[.data[] | select(.name==$n)][0] | if . then "\(.status) (\(.category), \(.language))" else empty end')
          if [ -z "$cur" ]; then
            body=$(jq -nc --arg n "$NAME" '{name:$n, language:"he", category:"UTILITY", components:[
              {type:"BODY", text:"יש לך עדכון חדש מ-The Agency Power: {{1}}\n\nלחצו על הכפתור כדי לקבל את כל הפרטים.", example:{body_text:[["הסרטון שביקשת מוכן"]]}},
              {type:"BUTTONS", buttons:[{type:"QUICK_REPLY", text:"הצג את העדכון"}]}]}')
            r=$(curl -s -X POST "$G/$WABA/message_templates" -H "Authorization: Bearer $WHATSAPP_TOKEN" -H "Content-Type: application/json" -d "$body")
            if echo "$r" | jq -e '.id' >/dev/null 2>&1; then cur="created, $(echo "$r" | jq -r '.status // "PENDING"') ($(echo "$r" | jq -r '.category // "UTILITY"'))"
            else cur="create FAILED ($(echo "$r" | jq -r '.error.error_user_msg // .error.message // .' | head -c 250))"; fi
          fi
          echo "::notice title=whatsapp-template::account ...${WABA: -4} | $NAME: $cur"

      - name: Show address
        if: steps.token.outputs.skip != 'true'
        run: |
          echo "### The Agency Power is live: https://$APP.fly.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "WhatsApp webhook: https://$APP.fly.dev/api/whatsapp/webhook" >> "$GITHUB_STEP_SUMMARY"
